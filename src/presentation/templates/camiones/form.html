{% extends "base.html" %}
{% block title %}{% if camion %}Editar Camión{% else %}Nuevo Camión{% endif %} | {{ app_name }}{% endblock %}
{% block content %}
<h1>{% if camion %}Editar Camión{% else %}Nuevo Camión{% endif %}</h1>

{% if error %}
<div id="form-error" class="alert alert-danger">{{ error }}</div>
{% endif %}

<form action="{% if camion %}/camiones/{{ camion.id }}/edit{% else %}/camiones/new{% endif %}" method="POST">
    <div class="form-group">
        <label for="placa">Placa</label>
        <input type="text" id="placa" name="placa" value="{{ form.placa }}" required>
    </div>
    <div class="form-group">
        <label for="marca">Marca</label>
        <input type="text" id="marca" name="marca" value="{{ form.marca }}">
    </div>
    <div class="form-group">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" value="{{ form.modelo }}">
    </div>
    <div class="form-group">
        <label for="anio">Año</label>
        <input type="number" id="anio" name="anio" value="{{ form.anio }}">
    </div>
    <div class="form-group">
        <label for="capacidad">Capacidad</label>
        <input type="number" id="capacidad" name="capacidad" value="{{ form.capacidad }}">
    </div>
    <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado" name="estado">
            <option value="activo" {% if form.estado == 'activo' %}selected{% endif %}>activo</option>
            <option value="inactivo" {% if form.estado == 'inactivo' %}selected{% endif %}>inactivo</option>
        </select>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/camiones" class="btn btn-outline">Cancelar</a>
    </div>
</form>
{% endblock %}
