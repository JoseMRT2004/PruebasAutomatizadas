{% extends "base.html" %}
{% block title %}{% if chofer %}Editar Chofer{% else %}Nuevo Chofer{% endif %} | {{ app_name }}{% endblock %}
{% block content %}
<h1>{% if chofer %}Editar Chofer{% else %}Nuevo Chofer{% endif %}</h1>

{% if error %}
<div id="form-error" class="alert alert-danger">{{ error }}</div>
{% endif %}

<form action="{% if chofer %}/choferes/{{ chofer.id }}/edit{% else %}/choferes/new{% endif %}" method="POST">
    <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" value="{{ form.nombre }}" required>
    </div>
    <div class="form-group">
        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" name="cedula" value="{{ form.cedula }}">
    </div>
    <div class="form-group">
        <label for="licencia">Licencia</label>
        <select id="licencia" name="licencia">
            {% for opt in ['A', 'B', 'C', 'D'] %}
            <option value="{{ opt }}" {% if form.licencia == opt %}selected{% endif %}>{{ opt }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" name="telefono" value="{{ form.telefono }}">
    </div>
    <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado" name="estado">
            <option value="activo" {% if form.estado == 'activo' %}selected{% endif %}>activo</option>
            <option value="inactivo" {% if form.estado == 'inactivo' %}selected{% endif %}>inactivo</option>
        </select>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/choferes" class="btn btn-outline">Cancelar</a>
    </div>
</form>
{% endblock %}
