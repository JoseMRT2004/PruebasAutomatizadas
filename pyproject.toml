[project]
name = "gestion-transporte"
version = "0.1.0"
description = "Sistema de gestión de transporte (choferes, camiones, rutas, horas trabajadas) con suite de pruebas automatizadas Selenium"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "itsdangerous>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-html>=4.1.0",
    "selenium>=4.25.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--html=reports/report.html --self-contained-html"
